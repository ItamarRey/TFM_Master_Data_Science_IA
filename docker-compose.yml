services:
  backend:
    build:
      context: .
      dockerfile: infrastructure/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
    volumes:
      - ./data:/app/data
      - ./models:/app/models

  frontend:
    build:
      context: .
      dockerfile: infrastructure/frontend.Dockerfile
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
